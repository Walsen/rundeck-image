name: Build Rundeck Image

on:
  push:
    branches: [main, 'feature/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rundeck_version:
        description: 'Rundeck version to build (leave empty for latest)'
        required: false
        type: string

permissions:
  contents: write

env:
  DOCKERHUB_IMAGE: ffactory/rundeck

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_version: ${{ steps.image.outputs.version }}
      full_version: ${{ steps.image.outputs.full_version }}
      plugin_version: ${{ steps.plugin.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest Rundeck version
        id: version
        run: |
          if [ -n "${{ inputs.rundeck_version }}" ]; then
            echo "version=${{ inputs.rundeck_version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(curl -s https://api.github.com/repos/rundeck/rundeck/releases/latest | jq -r '.tag_name' | sed 's/^v//')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Get image version
        id: image
        run: |
          IMAGE_VERSION=$(cat VERSION | tr -d '[:space:]')
          RUNDECK_VERSION="${{ steps.version.outputs.version }}"
          FULL_VERSION="${RUNDECK_VERSION}-${IMAGE_VERSION}"
          echo "version=$IMAGE_VERSION" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "Image version: $IMAGE_VERSION"
          echo "Full version: $FULL_VERSION"

      - name: Get latest plugin version
        id: plugin
        run: |
          PLUGIN_VERSION=$(curl -s https://api.github.com/repos/Walsen/rundeck-node-to-node/releases/latest | jq -r '.tag_name')
          echo "version=$PLUGIN_VERSION" >> $GITHUB_OUTPUT
          echo "Latest rundeck-node-to-node plugin version: $PLUGIN_VERSION"

  build:
    needs: get-version
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rundeck-test:${{ needs.get-version.outputs.version }}
          build-args: |
            RUNDECK_VERSION=${{ needs.get-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image
        run: |
          docker run --rm -d --name rundeck-test rundeck-test:${{ needs.get-version.outputs.version }}
          sleep 10
          docker exec rundeck-test nginx -t
          docker exec rundeck-test supervisorctl status
          docker stop rundeck-test

  push:
    needs: [get-version, build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ needs.get-version.outputs.full_version }}
            type=raw,value=${{ needs.get-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUNDECK_VERSION=${{ needs.get-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.full_version }}
          name: v${{ needs.get-version.outputs.full_version }}
          body: |
            ## Docker Image Release

            **Rundeck Version:** ${{ needs.get-version.outputs.version }}
            **Image Version:** ${{ needs.get-version.outputs.image_version }}
            **Plugin Version:** ${{ needs.get-version.outputs.plugin_version }}

            ### Docker Pull
            ```bash
            docker pull ffactory/rundeck:${{ needs.get-version.outputs.full_version }}
            ```

            ### What's Included
            - Rundeck ${{ needs.get-version.outputs.version }}
            - Nginx reverse proxy
            - Supervisor process management
            - rundeck-node-to-node plugin ${{ needs.get-version.outputs.plugin_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
